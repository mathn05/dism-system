<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Branch WMS - POS Sale</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-[#f4faff] text-[#111d23]">
<div th:replace="sidebar :: sidebar"></div>
<main id="site-main" class="ml-64 min-h-screen p-8">
    <header class="mb-8">
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-[#005FB8]">POS Sale</p>
        <h1 class="mt-2 text-3xl font-headline font-extrabold">POS placeholder</h1>
        <p class="mt-2 text-sm text-slate-600">Giữ trang này cho các chức năng bán hàng kế tiếp, hiện chỉ để lại bố cục gọn và dễ mở rộng.</p>
    </header>

    <section class="grid gap-6 xl:grid-cols-[1.4fr_0.8fr]">
        <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="text-lg font-headline font-bold">Product search area</h2>
            <div class="mt-4 rounded-xl border border-dashed border-slate-300 bg-slate-50 p-8 text-sm text-slate-500">
                Khu vực tìm kiếm sản phẩm, quét mã, và thêm vào giỏ sẽ được phát triển tiếp tại đây.
            </div>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="text-lg font-headline font-bold">Sale summary</h2>
            <div class="mt-4 space-y-3 text-sm text-slate-600">
                <div class="flex justify-between"><span>Subtotal</span><span>0</span></div>
                <div class="flex justify-between"><span>Tax</span><span>0</span></div>
                <div class="flex justify-between font-bold text-slate-900"><span>Total</span><span>0</span></div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
