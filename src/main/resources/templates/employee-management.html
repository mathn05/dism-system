<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - Users</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-headline {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            vertical-align: middle;
        }
    </style>
</head>

<body class="bg-[#f4faff] text-[#111d23]">

<div th:replace="sidebar :: sidebar"></div>

<main class="ml-64 min-h-screen flex flex-col">

    <header class="bg-[#f4faff] flex justify-between items-center px-6 py-4 border-b border-slate-200">
        <h1 class="text-lg font-black font-headline">User Management</h1>

        <button onclick="openUserModal()"
                class="bg-[#004692] text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">add</span>
            Create User
        </button>
    </header>

    <div class="p-6 space-y-6">

        <form method="get"
              th:action="@{/admin/users}"
              class="bg-white p-4 rounded-xl border flex items-center gap-3">

            <span class="material-symbols-outlined text-slate-400">search</span>

            <label class="flex-1">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="Search username, fullname..."
                       class="w-full border-none focus:ring-0 text-sm"/>
            </label>

            <label>
                <select name="stationId"
                        class="border rounded-lg px-3 py-2 text-sm min-w-[180px]">

                    <option value="">All stations</option>

                    <option th:each="s : ${stations}"
                            th:value="${s.id}"
                            th:selected="${s.id == selectedStationId}"
                            th:text="${s.name}">
                    </option>

                </select>
            </label>

            <button type="submit"
                    class="ml-auto bg-[#004692] text-white px-4 py-2 rounded-lg text-sm">
                Filter
            </button>

        </form>

        <div class="bg-white rounded-xl border overflow-hidden">

            <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-600 text-xs uppercase">
                <tr>
                    <th class="text-left p-4">Username</th>
                    <th class="text-left p-4">Fullname</th>
                    <th class="text-left p-4">Role</th>
                    <th class="text-left p-4">Station</th>
                    <th class="text-right p-4">Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="u : ${users}" class="border-t hover:bg-slate-50">
                    <td class="p-4 font-semibold" th:text="${u.username}">admin</td>
                    <td class="p-4" th:text="${u.fullname}">Nguyen Van A</td>

                    <td class="p-4">
                        <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-700"
                              th:text="${u.role}">
                        </span>
                    </td>

                    <td class="p-4 text-slate-600" th:text="${u.station.id}">
                        TS_HN
                    </td>

                    <td class="p-4 text-right flex justify-end gap-2">

                        <a href="#"
                           th:attr="data-id=${u.id},
            data-username=${u.username},
            data-fullname=${u.fullname},
            data-phone=${u.phoneNumber},
            data-role=${u.role},
            data-station=${u.station.id}"
                           onclick="openEditModal(this)"
                           class="px-3 py-1 text-xs bg-amber-100 text-amber-700 rounded-lg">
                            Edit
                        </a>

                        <button type="button"
                                class="px-3 py-1 text-xs bg-red-100 text-red-700 rounded-lg"
                                th:attr="data-id=${u.id}, data-username=${u.username}"
                                onclick="openDeleteModal(this)">
                            Delete
                        </button>

                    </td>
                </tr>

                </tbody>
            </table>

        </div>

    </div>
</main>

<script>
    function openUserModal() {
        resetForm();

        document.getElementById("userForm").action = "/admin/users/create";
        document.getElementById("modalTitle").innerText = "Create User";
        document.getElementById("submitBtn").innerText = "Create";

        openModal();
    }

    function openEditModal(el) {
        document.getElementById("userForm").action = "/admin/users/update";
        document.getElementById("modalTitle").innerText = "Edit User";
        document.getElementById("submitBtn").innerText = "Update";

        document.getElementById("userId").value = el.dataset.id || "";
        document.getElementById("username").value = el.dataset.username || "";
        document.getElementById("fullname").value = el.dataset.fullname || "";
        document.getElementById("phone").value = el.dataset.phone || "";
        document.getElementById("role").value = el.dataset.role || "";
        document.getElementById("station").value = el.dataset.station || "";

        document.getElementById("password").value = "";

        openModal();
    }

    function openModal() {
        const modal = document.getElementById("userModal");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
    }

    function closeUserModal() {
        const modal = document.getElementById("userModal");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
    }

    function resetForm() {
        document.getElementById("userId").value = "";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("fullname").value = "";
        document.getElementById("phone").value = "";
    }

    function openDeleteModal(el) {
        const id = el.dataset.id;
        const username = el.dataset.username;

        const displayElem = document.getElementById("deleteUsernameDisplay");
        if(displayElem) {
            displayElem.innerText = username;
        }

        document.getElementById("deleteForm").action = "/admin/users/delete/" + id;

        const modal = document.getElementById("deleteModal");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
    }

    function closeDeleteModal() {
        const modal = document.getElementById("deleteModal");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
    }
</script>

<div id="userModal"
     class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">

    <div class="bg-white w-full max-w-xl rounded-xl shadow-xl p-6">

        <div class="flex justify-between items-center mb-4">
            <h2 id="modalTitle" class="text-lg font-bold">Create User</h2>

            <button type="button"
                    onclick="closeUserModal()"
                    class="text-slate-500 hover:text-red-500">
                ✕
            </button>
        </div>

        <form id="userForm"
              th:action="@{/admin/users/create}"
              method="post"
              class="space-y-4">
            <div>
                <label class="text-sm font-semibold">User ID</label>
                <label for="userId"></label><input id="userId" name="id"
                                                   class="w-full border rounded-lg p-2 mt-1"
                                                   placeholder="Auto hoặc nhập thủ công"/>
            </div>
            <div>
                <label class="text-sm font-semibold">Username</label>
                <label for="username"></label><input id="username" name="username"
                                                     class="w-full border rounded-lg p-2 mt-1"/>
            </div>
            <div>
                <label class="text-sm font-semibold">Password</label>
                <label for="password"></label><input id="password" name="password" type="password"
                                                     class="w-full border rounded-lg p-2 mt-1"/>
            </div>
            <div>
                <label class="text-sm font-semibold">Fullname</label>
                <label for="fullname"></label><input id="fullname" name="fullname"
                                                     class="w-full border rounded-lg p-2 mt-1"/>
            </div>
            <div>
                <label class="text-sm font-semibold">Phone Number</label>
                <label for="phone"></label><input id="phone" name="phoneNumber"
                                                  class="w-full border rounded-lg p-2 mt-1"
                                                  placeholder="0xxxxxxxxx"/>
            </div>
            <div class="grid grid-cols-2 gap-3">

                <div>
                    <label class="text-sm font-semibold">Role</label>
                    <label for="role"></label><label for="role"></label><select id="role" name="role"
                                                                                class="w-full border rounded-lg p-2 mt-1">
                        <option value="ADMIN">ADMIN</option>
                        <option value="BRANCH_STAFF">BRANCH_STAFF</option>
                    </select>
                </div>

                <div>
                    <label class="text-sm font-semibold">Station</label>
                    <label for="station"></label><select id="station" name="stationId"
                                                         class="w-full border rounded-lg p-2 mt-1">
                        <option th:each="s : ${stations}"
                                th:value="${s.id}"
                                th:text="${s.id + ' - ' + s.name}">
                        </option>
                    </select>
                </div>

            </div>

            <div class="flex justify-end gap-2 pt-4">

                <button type="button"
                        onclick="closeUserModal()"
                        class="px-4 py-2 rounded-lg border text-sm">
                    Cancel
                </button>

                <button id="submitBtn"
                        type="submit"
                        class="px-4 py-2 rounded-lg bg-[#004692] text-white text-sm">
                    Create
                </button>

            </div>

        </form>

    </div>
</div>

<div id="deleteModal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">

    <div class="bg-white w-full max-w-md rounded-xl shadow-2xl p-6 transform transition-all">

        <div class="flex items-center gap-3 text-red-600 mb-4">
            <span class="material-symbols-outlined text-3xl">warning</span>
            <h2 class="text-xl font-bold font-headline">Confirm Delete</h2>
        </div>

        <p class="text-slate-600 text-sm leading-relaxed">
            Bạn có chắc chắn muốn xóa người dùng
            <span id="deleteUsernameDisplay" class="font-bold text-[#111d23]"></span>?
            Hành động này không thể hoàn tác.
        </p>

        <form id="deleteForm" method="post" class="mt-8 flex justify-end gap-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button type="button"
                    onclick="closeDeleteModal()"
                    class="px-5 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors">
                Hủy bỏ
            </button>

            <button type="submit"
                    class="px-5 py-2.5 rounded-lg bg-red-600 text-white text-sm font-semibold hover:bg-red-700 shadow-lg shadow-red-200 transition-all">
                Xác nhận xóa
            </button>
        </form>
    </div>
</div>


</body>


</html>
