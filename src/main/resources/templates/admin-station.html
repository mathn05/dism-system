<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - Stations</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { vertical-align: middle; }
    </style>
</head>

<body class="bg-[#f4faff] text-[#111d23]">

<div th:replace="sidebar :: sidebar"></div>

<main class="ml-64 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-[#f4faff] flex justify-between items-center px-6 py-4 border-b border-slate-200">
        <h1 class="text-lg font-black font-headline">Station Management</h1>

        <button onclick="openStationModal()"
                class="bg-[#004692] text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">add</span>
            Create Station
        </button>
    </header>

    <div class="p-6 space-y-6">
        <form method="get"
              th:action="@{/admin/stations}"
              class="bg-white p-4 rounded-xl border flex gap-3 items-center">

            <span class="material-symbols-outlined text-slate-400">search</span>

            <label class="flex-1">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="Search station name, address..."
                       class="w-full border-none focus:ring-0 text-sm"/>
            </label>

            <button type="submit"
                    class="ml-auto bg-[#004692] text-white px-4 py-2 rounded-lg text-sm">
                Filter
            </button>
        </form>

        <!-- TABLE -->
        <div class="bg-white rounded-xl border overflow-hidden">

            <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-600 text-xs uppercase">
                <tr>
                    <th class="text-left p-4">ID</th>
                    <th class="text-left p-4">Name</th>
                    <th class="text-left p-4">Address</th>
                    <th class="text-right p-4">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="s : ${stations}" class="border-t hover:bg-slate-50">
                    <td class="p-4 font-semibold" th:text="${s.id}">ST01</td>
                    <td class="p-4" th:text="${s.name}">Station A</td>
                    <td class="p-4" th:text="${s.address}">Hanoi</td>
                    <td class="p-4 text-right flex justify-end gap-2">

                        <a href="#"
                           th:attr="data-id=${s.id}, data-name=${s.name}, data-address=${s.address}, data-headquarter=${s.headquarter}"
                           onclick="openEditStationModal(this)"
                           class="px-3 py-1 text-xs bg-amber-100 text-amber-700 rounded-lg">
                            Edit
                        </a>

                        <button type="button"
                                th:attr="data-id=${s.id}, data-name=${s.name}"
                                onclick="openDeleteStationModal(this)"
                                class="px-3 py-1 text-xs bg-red-100 text-red-700 rounded-lg">
                            Delete
                        </button>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>
<div id="stationModal"
     class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">

    <div class="bg-white w-full max-w-xl rounded-xl shadow-xl p-6">

        <div class="flex justify-between items-center mb-4">
            <h2 id="stationModalTitle" class="text-lg font-bold">Create Station</h2>
            <button onclick="closeStationModal()">✕</button>
        </div>

        <form id="stationForm" method="post" th:action="@{/admin/stations/create}" class="space-y-4">

            <div>
                <label class="text-sm font-semibold">ID</label>
                <label for="stationId"></label><input id="stationId" name="id" class="w-full border rounded-lg p-2 mt-1"/>
            </div>

            <div>
                <label class="text-sm font-semibold">Name</label>
                <label for="stationName"></label><input id="stationName" name="name" class="w-full border rounded-lg p-2 mt-1"/>
            </div>

            <div>
                <label class="text-sm font-semibold">Address</label>
                <label for="stationAddress"></label><input id="stationAddress" name="address" class="w-full border rounded-lg p-2 mt-1"/>
            </div>

            <div class="flex items-center gap-2">
                <input type="hidden" name="headquarter" value="false"/>

                <label for="stationHeadquarter"></label><input type="checkbox"
                                                               id="stationHeadquarter"
                                                               name="headquarter"
                                                               value="true"/>
            </div>

            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeStationModal()" class="px-4 py-2 border rounded-lg">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-[#004692] text-white rounded-lg">Save</button>
            </div>

        </form>
    </div>
</div>

<div id="deleteModal"
     class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">

    <div class="bg-white w-full max-w-md rounded-xl shadow-xl p-6">

        <h2 class="text-lg font-bold mb-3">Delete Station</h2>

        <p class="text-sm text-slate-600 mb-6">
            Are you sure you want to delete station
            <span id="deleteStationName" class="font-semibold"></span> ?
        </p>

        <form id="deleteForm" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="flex justify-end gap-2">
                <button type="button"
                        onclick="closeDeleteModal()"
                        class="px-4 py-2 border rounded-lg">
                    Cancel
                </button>

                <button type="submit"
                        class="px-4 py-2 bg-red-600 text-white rounded-lg">
                    Delete
                </button>
            </div>
        </form>

    </div>
</div>

<script>
    function openStationModal(){
        document.getElementById('stationForm').action='/admin/stations/create';
        document.getElementById('stationModalTitle').innerText='Create Station';
        document.getElementById('stationModal').classList.remove('hidden');
        document.getElementById('stationModal').classList.add('flex');
    }

    function closeStationModal(){
        const modal = document.getElementById('stationModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.getElementById('stationForm').reset();
        document.getElementById('stationId').value = "";
    }

    function openEditStationModal(el){
        document.getElementById('stationForm').action='/admin/stations/update';
        document.getElementById('stationModalTitle').innerText='Edit Station';

        document.getElementById('stationId').value=el.dataset.id;
        document.getElementById('stationName').value=el.dataset.name;
        document.getElementById('stationAddress').value=el.dataset.address;
        document.getElementById('stationHeadquarter').checked = el.dataset.headquarter === 'true';

        document.getElementById('stationModal').classList.remove('hidden');
        document.getElementById('stationModal').classList.add('flex');
    }

    function openDeleteStationModal(el) {
        const id = el.dataset.id;
        document.getElementById('deleteStationName').innerText = el.dataset.name;

        const form = document.getElementById('deleteForm');
        form.action = '/admin/stations/delete/' + id;

        const modal = document.getElementById('deleteModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeDeleteModal() {
        const modal = document.getElementById('deleteModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }
</script>

</body>
</html>
