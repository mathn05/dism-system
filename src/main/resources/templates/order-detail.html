<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Branch WMS - Order Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-[#f4faff] text-[#111d23]">
<div th:replace="sidebar :: sidebar"></div>
<main id="site-main" class="ml-64 min-h-screen flex flex-col">
    <header class="bg-[#f4faff] flex justify-between items-center w-full px-6 py-3 border-b border-slate-200">
        <div class="flex items-center gap-4">
            <h1 class="text-lg font-black font-headline">Order Detail</h1>
            <div class="h-4 w-px bg-slate-300/60"></div>
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[#005FB8] text-sm">assignment</span>
                <span class="text-xs font-bold text-slate-600 tracking-wide" th:text="${currentStation.name + ' - ' + currentStation.id}">Station</span>
            </div>
        </div>
        <a th:href="@{/order}" class="inline-flex items-center gap-2 rounded-lg bg-white px-4 py-2 text-sm font-bold text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            Back to orders
        </a>
    </header>

    <div class="p-8">
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-200">
                <h2 class="text-2xl font-headline font-extrabold tracking-tight">Order information</h2>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <div class="text-[11px] text-slate-500 uppercase font-bold tracking-wider">Order ID</div>
                    <div class="mt-2 text-sm font-semibold text-slate-900 break-all" th:text="${order.id}"></div>
                </div>
                <div>
                    <div class="text-[11px] text-slate-500 uppercase font-bold tracking-wider">Type</div>
                    <div class="mt-2 text-sm font-semibold text-slate-900" th:text="${order.type}"></div>
                </div>
                <div>
                    <div class="text-[11px] text-slate-500 uppercase font-bold tracking-wider">Created At</div>
                    <div class="mt-2 text-sm font-semibold text-slate-900" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
                </div>
                <div>
                    <div class="text-[11px] text-slate-500 uppercase font-bold tracking-wider">Created By</div>
                    <div class="mt-2 text-sm font-semibold text-slate-900" th:text="${order.user != null ? order.user.username : '-'}"></div>
                </div>
                <div>
                    <div class="text-[11px] text-slate-500 uppercase font-bold tracking-wider">Customer</div>
                    <div class="mt-2 text-sm text-slate-600" th:text="${order.customer != null ? order.customer.name : '-'}"></div>
                </div>
                <div>
                    <div class="text-[11px] text-slate-500 uppercase font-bold tracking-wider">From Station</div>
                    <div class="mt-2 text-sm text-slate-600" th:text="${order.fromStation != null ? order.fromStation.name : '-'}"></div>
                </div>
                <div>
                    <div class="text-[11px] text-slate-500 uppercase font-bold tracking-wider">To Station</div>
                    <div class="mt-2 text-sm text-slate-600" th:text="${order.toStation != null ? order.toStation.name : '-'}"></div>
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
