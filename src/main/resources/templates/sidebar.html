<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="sidebar">

    <aside class="h-screen w-64 fixed left-0 top-0 z-50 bg-[#cfdce4] flex flex-col border-r border-[#c2c6d4]/15">

        <!-- Header -->
        <div class="p-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#004692] flex items-center justify-center rounded-lg shadow-inner">
                    <span class="material-symbols-outlined text-white">warehouse</span>
                </div>

                <h2 class="font-extrabold text-[#004692] text-xl tracking-tight"
                    th:text="${currentStation != null ? currentStation.name : 'HEAD OFFICE'}">
                    Station Alpha
                </h2>

                <p class="text-on-surface-variant text-xs font-medium mt-1"
                   th:text="${currentStation != null ? currentStation.id : 'ADMIN'}">
                    STATION-ALPHA-7
                </p>
            </div>
        </div>

        <!-- Menu -->
        <nav class="flex-1 mt-4">

            <!-- ADMIN MENU -->
            <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/admin/dashboard}">
                    <span class="material-symbols-outlined mr-3">dashboard</span>
                    <span>Dashboard</span>
                </a>

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/admin/users}">
                    <span class="material-symbols-outlined mr-3">badge</span>
                    <span>Employee</span>
                </a>

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/admin/stations}">
                    <span class="material-symbols-outlined mr-3">store</span>
                    <span>Station</span>
                </a>

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/admin/reports}">
                    <span class="material-symbols-outlined mr-3">bar_chart</span>
                    <span>Reports</span>
                </a>

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/admin/masterdata}">
                    <span class="material-symbols-outlined mr-3">database</span>
                    <span>Master Data</span>
                </a>

            </div>


            <!-- STAFF MENU -->
            <div th:unless="${#authorization.expression('hasRole(''ADMIN'')')}">

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/dashboard}">
                    <span class="material-symbols-outlined mr-3">dashboard</span>
                    <span>Dashboard</span>
                </a>

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/inventory}">
                    <span class="material-symbols-outlined mr-3">inventory_2</span>
                    <span>Inventory</span>
                </a>

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/imports}">
                    <span class="material-symbols-outlined mr-3">local_shipping</span>
                    <span>Imports</span>
                </a>

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/sales}">
                    <span class="material-symbols-outlined mr-3">point_of_sale</span>
                    <span>Sales</span>
                </a>

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/customer}">
                    <span class="material-symbols-outlined mr-3">groups</span>
                    <span>Customer</span>
                </a>

                <a class="sidebar-link flex items-center text-[#424752] hover:bg-[#e3f0f8] rounded-lg mx-2 my-1 px-4 py-3"
                   th:href="@{/masterdata}">
                    <span class="material-symbols-outlined mr-3">database</span>
                    <span>Master Data</span>
                </a>

            </div>

        </nav>

        <!-- Logout -->
        <div class="mt-auto p-2 border-t border-[#c2c6d4]/15">
            <form method="post" th:action="@{/logout}">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <button type="submit"
                        class="w-full flex items-center gap-3 text-[#424752] px-4 py-3 rounded-lg hover:bg-[#e3f0f8]">
                    <span class="material-symbols-outlined">logout</span>
                    <span>Logout</span>
                </button>
            </form>
        </div>

    </aside>

</div>
</html>
