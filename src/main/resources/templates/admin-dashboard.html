<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin - Dashboard</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet"/>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
          rel="stylesheet"/>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
            vertical-align: middle;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        .font-headline {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f4faff] text-[#111d23]">

<div th:replace="sidebar :: sidebar"></div>

<main id="site-main" class="ml-64 min-h-screen flex flex-col">

    <header class="bg-[#f4faff] flex justify-between items-center w-full px-6 py-3 border-b border-slate-200">

        <div class="flex items-center gap-4">
            <h1 class="text-lg font-black font-headline">Dashboard</h1>

            <div class="h-4 w-px bg-slate-300/60"></div>

            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[#005FB8] text-sm">location_on</span>

                <span class="text-xs font-bold text-slate-600 tracking-wide">
                    System Overview
                </span>
            </div>
        </div>

        <div class="text-xs font-headline font-bold text-slate-500">
            Business analytics
        </div>

    </header>

    <div class="p-8 space-y-8">

        <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">

            <div class="rounded-xl border bg-white p-5">
                <div class="text-xs font-bold uppercase text-slate-500">
                    Doanh thu tổng
                </div>

                <div class="mt-2 text-3xl font-black text-[#004692]"
                     th:text="${#numbers.formatDecimal(totalRevenue,0,'COMMA',0,'POINT')} + ' VNĐ'">
                    0 VNĐ
                </div>
            </div>

            <div class="rounded-xl border bg-white p-5">
                <div class="text-xs font-bold uppercase text-slate-500">
                    Tổng đơn hàng
                </div>

                <div class="mt-2 text-3xl font-black text-slate-900"
                     th:text="${totalOrders}">
                    0
                </div>
            </div>

            <div class="rounded-xl border bg-white p-5">
                <div class="text-xs font-bold uppercase text-slate-500">
                    Tồn kho toàn hệ thống
                </div>

                <div class="mt-2 text-3xl font-black text-[#004692]"
                     th:text="${totalInventory}">
                    0
                </div>
            </div>

            <div class="rounded-xl border bg-white p-5">
                <div class="text-xs font-bold uppercase text-slate-500">
                    Sắp hết hàng
                </div>

                <div class="mt-2 text-3xl font-black text-red-600"
                     th:text="${lowStockCount}">
                    0
                </div>
            </div>

        </section>

        <section class="grid grid-cols-1 xl:grid-cols-2 gap-6">

            <div class="bg-white rounded-xl border shadow-sm p-6">

                <h3 class="text-lg font-bold">Doanh thu 7 ngày gần đây</h3>

                <div class="mt-4 h-64">
                    <canvas id="revenueChart"></canvas>
                </div>

            </div>

            <div class="bg-white rounded-xl border shadow-sm p-6">

                <h3 class="text-lg font-bold">Đơn hàng 7 ngày gần đây</h3>

                <div class="mt-4 h-64">
                    <canvas id="ordersChart"></canvas>
                </div>

            </div>

        </section>

        <section class="grid grid-cols-1 xl:grid-cols-2 gap-6">

            <div class="bg-white rounded-xl border shadow-sm p-6">

                <h3 class="text-lg font-bold">Top chi nhánh</h3>

                <div class="mt-4 space-y-4">

                    <div th:each="item : ${topStations}">
                        <div class="flex justify-between text-sm mb-1">
                            <span th:text="${item.stationName}">Station</span>
                            <span th:text="${item.totalOrders}">0</span>
                        </div>

                        <div class="h-2 rounded-full bg-slate-100">
                            <div class="h-2 rounded-full bg-[#005FB8]"
                                 th:style="'width:' + ${item.percent} + '%'"></div>
                        </div>
                    </div>

                </div>

            </div>

            <div class="bg-white rounded-xl border shadow-sm p-6">

                <h3 class="text-lg font-bold">Top sản phẩm</h3>

                <div class="mt-4 space-y-3">

                    <div class="flex justify-between text-sm border-b pb-2"
                         th:each="item : ${topProducts}">
                        <span th:text="${item.productName}">Product</span>
                        <span class="font-bold text-[#004692]"
                              th:text="${item.totalSold}">
                            0
                        </span>
                    </div>

                </div>

            </div>

        </section>

    </div>

</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    const revenueLabels = /*[[${revenueLabels}]]*/ [];
    const revenueData   = /*[[${revenueData}]]*/ [];

    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: revenueLabels,
            datasets: [{
                label: 'Revenue',
                data: revenueData,
                borderColor: '#005FB8',
                backgroundColor: 'rgba(0,95,184,0.10)',
                borderWidth: 2,
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
    /*]]>*/
</script>

<script th:inline="javascript">
    /*<![CDATA[*/
    const orderLabels = /*[[${orderLabels}]]*/ [];
    const orderData   = /*[[${orderData}]]*/ [];

    new Chart(document.getElementById('ordersChart'), {
        type: 'bar',
        data: {
            labels: orderLabels,
            datasets: [{
                label: 'Orders',
                data: orderData,
                backgroundColor: '#004692'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
    /*]]>*/
</script>

</body>
</html>
